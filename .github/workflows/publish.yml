name: publish

# Publishes the npm wrapper and the Python package on version tags (v*).
# Both jobs stamp the package version from the tag, so the tag is the single
# source of truth.
#
# Requires (one-time setup, see README "Releasing"):
#   npm  — repo secret NPM_TOKEN: granular access token at npmjs.com with
#          publish scope on @ioserviceslabs/searchio-mcp
#   PyPI — EITHER Trusted Publishing configured on pypi.org for this repo +
#          this workflow filename (no secret needed; the OIDC exchange in
#          gh-action-pypi-publish takes over when no password is set)
#          OR the repo secret PYPI_API_TOKEN
#
# These only start succeeding once the repos/packages go public: the npm
# package is @ioserviceslabs/searchio-mcp (org-scoped) and PyPI serves the
# sdist/wheel built here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Sync version from tag
        working-directory: packaging/npm
        # --allow-same-version: package.json may already carry this version
        # (a retag/re-run), and plain `npm version` exits 1 when unchanged.
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: Publish
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing (used when PYPI_API_TOKEN is unset)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync version from tag
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A retag re-runs this job after a successful upload; duplicates
          # then warn instead of failing the run.
          skip-existing: true
