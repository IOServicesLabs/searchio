[project]
name = "searchio"
version = "0.1.0"
description = "LLM-assisted search: a research swarm over a blocking-resistant acquisition ladder."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "httpx[http2,brotli,zstd]>=0.27",
    "brotli>=1.1",
    "zstandard>=0.22",
    "curl_cffi>=0.7",
    "trafilatura>=1.12",
    # trafilatura's justext imports lxml.html.clean, which lxml >= 5.2 moved
    # to its own package: without it trafilatura fails to import and every
    # HTML read falls back to a crude tag strip (found 2026-10-28).
    "lxml_html_clean>=0.1",
    "pypdf>=4",
    "selectolax>=0.3.21,<1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.2",
    # YouTube transcripts: the only caption leg that survives the PO-token
    # gate (see src/searchio/transcripts.py). Pure Python, no browser.
    "youtube-transcript-api>=1.2",
]

[project.urls]
Homepage = "https://www.ioservices.io/searchio"
Repository = "https://github.com/IOServicesLabs/searchio"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
# MCP server (`python -m searchio.mcp` / `searchio mcp`). Optional so the core
# still installs and runs with an empty environment; the server errors clearly
# if the SDK is missing.
mcp = ["mcp>=1.8,<2"]

[project.scripts]
# fastcli hands `search --json` to a running `searchio serve` when
# SEARCHIO_DAEMON_URL is set; everything else is the typer app.
searchio = "searchio.fastcli:main"
# LLM-facing entry: `searchio-mcp` boots the MCP server over stdio the moment
# the package is installed (requires the `mcp` extra). Engine tier activates
# when a se-serve binary is resolvable (SEARCHIO_ENGINE_BIN, a sibling
# checkout, or ~/.searchio/bin -- which the Docker image populates).
searchio-mcp = "searchio.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/searchio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
