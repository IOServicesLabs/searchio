[project]
name = "searchio"
version = "0.1.0"
description = "LLM-assisted search: a research swarm over a blocking-resistant acquisition ladder."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "httpx[http2,brotli,zstd]>=0.27",
    "brotli>=1.1",
    "zstandard>=0.22",
    "curl_cffi>=0.7",
    "trafilatura>=1.12",
    "pypdf>=4",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "youtube-transcript-api>=0.6"]
# MCP server (`python -m searchio.mcp` / `searchio mcp`). Optional so the core
# still installs and runs with an empty environment; the server errors clearly
# if the SDK is missing.
mcp = ["mcp>=1.8,<2"]

[project.scripts]
searchio = "searchio.cli:app"
# LLM-facing entry: `searchio-mcp` boots the MCP server over stdio the moment
# the package is installed (requires the `mcp` extra). Engine tier activates
# when a se-serve binary is resolvable (SEARCHIO_ENGINE_BIN, a sibling
# checkout, or ~/.searchio/bin -- which the Docker image populates).
searchio-mcp = "searchio.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/searchio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
